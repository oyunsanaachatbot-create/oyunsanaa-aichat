name: Deploy Next.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /***/oyunsanaa/oyunsanaa-aichat

            # 1. Pull down the fresh code
            git pull origin main

            # 2. Install all dependencies (including devDependencies like tsx)
            npm install

            # 3. Force a clean, brand-new production build
            rm -rf .next
            npm run build

            # 4. Restart the app only after the build completely succeeds
            pm2 restart oyunsanaa-chat || pm2 start npm --name "oyunsanaa-chat" -- run start
