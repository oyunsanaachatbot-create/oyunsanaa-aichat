name: Deploy Next.js App

on:
  push:
    branches:
      - main-backup
      - testing

concurrency:
  group: oyunsanaa-aichat-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main-backup'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            cd /***/oyunsanaa/oyunsanaa-aichat

            # 1. Pull down the fresh code
            git pull origin main-backup

            # 2. Install all dependencies (including devDependencies like tsx)
            npm install

            # 3. Build (reuse .next cache for faster incremental builds)
            NODE_OPTIONS=--max-old-space-size=1536 npm run build

            # 4. Restart the app only after the build completely succeeds
            pm2 restart oyunsanaa-chat || pm2 start npm --name "oyunsanaa-chat" -- run start

  deploy_testing:
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy testing via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 60m
          script: |
            set -euo pipefail

            # Both testing apps share a database; serialize their builds/migrations.
            exec 9>/root/test/.deploy.lock
            flock -w 1800 9

            cd /root/test/test-chat/oyunsanaa-aichat
            test -d .git || { echo 'Clone the testing branch into this folder first.'; exit 1; }
            test "$(git branch --show-current)" = testing

            # A failed pnpm 11 install can leave an untracked approval file.
            # Preserve it before Git brings in the committed build policy.
            if test -f pnpm-workspace.yaml && ! git ls-files --error-unmatch pnpm-workspace.yaml >/dev/null 2>&1; then
              backup_dir=$(mktemp -d .git/pnpm-policy-backup.XXXXXX)
              mv -- pnpm-workspace.yaml "$backup_dir/pnpm-workspace.yaml"
              echo "Backed up untracked pnpm policy to $backup_dir"
            fi

            git pull --ff-only origin testing
            test -s .env.production || { echo 'Create .env.production with testing credentials first.'; exit 1; }

            pnpm install --frozen-lockfile --prod=false

            # Load testing env for both the migration command and Next.js build.
            # Fail before migrations if the database URL is not the testing DB.
            node --env-file=.env.production <<'NODE'
            const { spawnSync } = require('node:child_process');
            const databaseUrl = new URL(process.env.POSTGRES_URL);
            if (databaseUrl.pathname !== '/oyunsanaa_testing') {
              throw new Error(`Refusing deployment: POSTGRES_URL must use oyunsanaa_testing (received database path: ${databaseUrl.pathname})`);
            }
            const result = spawnSync('pnpm', ['run', 'build'], {
              stdio: 'inherit',
              env: { ...process.env, NODE_ENV: 'production' },
            });
            if (result.error) throw result.error;
            process.exit(result.status ?? 1);
            NODE

            node --env-file=.env.production scripts/check-content-library.cjs
            NODE_OPTIONS=--conditions=react-server node --env-file=.env.production node_modules/tsx/dist/cli.mjs scripts/check-content-library-runtime.ts

            export DEPLOYMENT_COMMIT="$(git rev-parse HEAD)"
            if pm2 describe oyunsanaa-test-chat >/dev/null 2>&1; then
              pm2 restart oyunsanaa-test-chat --update-env
            else
              # Use a testing-only port without changing the production start script.
              pm2 start node_modules/next/dist/bin/next \
                --name oyunsanaa-test-chat \
                -- start -H 0.0.0.0 -p 8082
            fi

            pm2 save

            # Verify the exact revision served by the actual 8082 process.
            node <<'NODE'
            (async () => {
              for (let attempt=0;attempt<20;attempt++) {
                try {
                  const response=await fetch('http://127.0.0.1:8082/api/health',{signal:AbortSignal.timeout(5000)});
                  const body=await response.json();
                  if(response.ok&&body.status==='ok'&&body.revision===process.env.DEPLOYMENT_COMMIT) {
                    console.log('Running app readiness and deployed revision verified.');return;
                  }
                } catch {}
                await new Promise(resolve=>setTimeout(resolve,2000));
              }
              throw new Error('Running testing app revision could not be verified.');
            })().catch(error=>{console.error(error.message);process.exitCode=1;});
            NODE
